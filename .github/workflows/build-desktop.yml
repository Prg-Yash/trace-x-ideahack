name: Build Trace-X Desktop App

on:
  push:
    branches: [ main, master ]
    paths:
      - 'apps/frontend/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/frontend/src-tauri -> target'

      - name: Install frontend dependencies
        working-directory: ./apps/frontend
        run: npm ci

      - name: Build Tauri app
        working-directory: ./apps/frontend
        run: npm run tauri:build

      - name: Upload Windows Installer (NSIS)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: trace-x-windows-installer
          path: apps/frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Windows MSI
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: trace-x-windows-msi
          path: apps/frontend/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Create Release Info
        if: matrix.platform == 'windows-latest'
        run: |
          echo "# Trace-X Desktop App Build" > build-info.md
          echo "" >> build-info.md
          echo "**Platform:** Windows" >> build-info.md
          echo "**Build Date:** $(date)" >> build-info.md
          echo "**Commit:** ${{ github.sha }}" >> build-info.md
          echo "" >> build-info.md
          echo "## Files Included" >> build-info.md
          echo "- Windows Installer (.exe)" >> build-info.md
          echo "- Windows MSI (.msi)" >> build-info.md
        shell: bash

      - name: Upload Build Info
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.md
